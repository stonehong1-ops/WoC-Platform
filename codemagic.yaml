workflows:
  ios-release:
    name: iOS Release Build & TestFlight Upload
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic
    environment:
      node: 22.19.0
      xcode: latest
      cocoapods: default
      vars:
        NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyBFLzc4F7F_E9XidGRwB4EsAr5LN-Hu7i0"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "www.woc.today"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "woc-platform-seoul-1234"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "woc-platform-seoul-1234.firebasestorage.app"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1021887439599"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:1021887439599:web:7c5741009dd928b8fd311a"
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "AIzaSyBMSYywxC3FoqGAv6seFo0NsuPzXB2_1HU"
    triggering:
      events: [] # 수동 실행 전용
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Web Assets (Next.js)
        script: |
          npm run build
      - name: Copy Static Assets to Web Directory
        script: |
          # 정적 빌드 폴더 존재 시 public 디렉토리로 복사하는 프로젝트 절차 이행
          if [ -d "out" ]; then
            echo "Copying out/ to public/..."
            cp -R out/* public/
          elif [ -d "dist" ]; then
            echo "Copying dist/ to public/..."
            cp -R dist/* public/
          else
            echo "Using default public/ web assets."
          fi
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Validate iOS Project
        script: |
          if [ ! -e "ios/App/App.xcodeproj" ]; then
            echo "Error: ios/App/App.xcodeproj not found!"
            exit 1
          fi
          echo "iOS Project validated successfully."
      - name: Codemagic Code Signing
        script: |
          # 업로드된 수동 인증서와 프로필을 빌드 환경에 주입하고 매핑합니다.
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build Xcode Archive & Export IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
      - name: Print Build & Upload Info
        script: |
          echo "=================================================================="
          echo "🚀 빌드 완료 및 TestFlight 업로드 단계 진입"
          echo "📦 빌드 번호: 2 (CURRENT_PROJECT_VERSION)"
          echo "🔗 App Store Connect 링크: https://appstoreconnect.apple.com/"
          echo "=================================================================="
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
