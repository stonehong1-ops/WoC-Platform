workflows:
  ios-release:
    name: iOS Release Build & TestFlight Upload
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic
    environment:
      node: 22.19.0
      xcode: latest
      cocoapods: default
      ios_signing:
        certificates:
          - woc_distribution_cert
        provisioning_profiles:
          - woc_app_store_profile
      vars:
        NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyBFLzc4F7F_E9XidGRwB4EsAr5LN-Hu7i0"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "www.woc.today"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "woc-platform-seoul-1234"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "woc-platform-seoul-1234.firebasestorage.app"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1021887439599"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:1021887439599:web:7c5741009dd928b8fd311a"
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "AIzaSyBMSYywxC3FoqGAv6seFo0NsuPzXB2_1HU"
    triggering:
      events: [] # 수동 실행 전용
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Web Assets (Next.js)
        script: |
          npm run build
      - name: Copy Static Assets to Web Directory
        script: |
          # 정적 빌드 폴더 존재 시 public 디렉토리로 복사하는 프로젝트 절차 이행
          if [ -d "out" ]; then
            echo "Copying out/ to public/..."
            cp -R out/* public/
          elif [ -d "dist" ]; then
            echo "Copying dist/ to public/..."
            cp -R dist/* public/
          else
            echo "Using default public/ web assets."
          fi
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Validate iOS Project
        script: |
          if [ ! -e "ios/App/App.xcodeproj" ]; then
            echo "Error: ios/App/App.xcodeproj not found!"
            exit 1
          fi
          echo "iOS Project validated successfully."
      - name: Codemagic Code Signing
        script: |
          # 1. 키체인 초기화 및 업로드된 인증서 설치
          keychain initialize
          keychain add-certificates
          
          # 2. 업로드된 프로필 매핑 적용
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Increment Build Number
        script: |
          set -euo pipefail
          
          echo "Checked-out commit:"
          git rev-parse HEAD
          
          echo "Current branch:"
          git branch --show-current || true

          LATEST_BUILD_NUMBER=$(
            app-store-connect get-latest-app-store-build-number \
              --bundle-id "com.woc.today" \
              --all-versions
          )

          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest App Store build: $LATEST_BUILD_NUMBER"
          echo "Next build number: $NEXT_BUILD_NUMBER"

          cd "$CM_BUILD_DIR/ios/App"
          xcrun agvtool new-version -all "$NEXT_BUILD_NUMBER"
          
          echo "Project versions after agvtool:"
          grep -n "CURRENT_PROJECT_VERSION" "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
      - name: Build Xcode Archive & Export IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
      - name: Validate IPA Metadata
        script: |
          IPA_PATH=$(find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -name "*.ipa" | head -n 1)
          test -n "$IPA_PATH" || { echo "IPA not found"; exit 1; }

          rm -rf /tmp/woc_ipa_check
          mkdir -p /tmp/woc_ipa_check
          unzip -q "$IPA_PATH" -d /tmp/woc_ipa_check

          APP_PLIST=$(find /tmp/woc_ipa_check/Payload -maxdepth 2 -name Info.plist | head -n 1)
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")

          echo "IPA CFBundleVersion: $IPA_VERSION"

          if [ "$IPA_VERSION" -le 4 ]; then
            echo "Invalid IPA build number: $IPA_VERSION"
            exit 1
          fi
      - name: Print Build & Upload Info
        script: |
          echo "=================================================================="
          echo "🚀 빌드 완료 및 TestFlight 업로드 단계 진입"
          echo "🔗 App Store Connect 링크: https://appstoreconnect.apple.com/"
          echo "=================================================================="
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
